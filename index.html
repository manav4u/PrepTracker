    <script>
      // Legacy hash-route redirect: the app lived under /#/... before moving to real paths.
      // Map any saved or shared hash link to its new URL, then let the app boot.
      (function () {
        var h = location.hash;
        if (!h || h.charAt(1) !== '/') return;
        var p = h.slice(1);
        if (p === '/') p = '/app';
        else if (p === '/landing') p = '/';
        else if (p === '/directory') { location.replace('/syllabus/'); return; }
        else if (p.indexOf('/add/') === 0) p = '/onboarding?add=' + p.slice(5);
        else if (p.indexOf('/app') !== 0 && p !== '/onboarding') p = '/app' + p;
        var base = location.pathname.replace(/index\.html$/, '');
        if (base.charAt(base.length - 1) !== '/') base += '/';
        history.replaceState(null, '', base + p.slice(1) + location.search);
      })();
    </script>
